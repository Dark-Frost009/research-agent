[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "A LangGraph-based research agent with grounded citations and iterative critique."
requires-python = ">=3.12,<4"

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph>=1.2.11,<1.3",
    "tavily-python>=0.8.3,<0.9",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "google-genai>=2.23,<3",
    "httpx>=0.28.1,<1",
    "streamlit>=1.64,<2",
]

[project.scripts]
research-agent = "research_agent.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
